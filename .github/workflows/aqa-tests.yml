name: AQA tests

on:
  push:
    branches: [hw8-aqa]
    paths:
      - 'aqa/**'
      - '.github/workflows/aqa-tests.yml'
  workflow_dispatch:
    inputs:
      subset:
        description: Which scenarios to run (tag or level)
        type: choice
        default: all
        options: [all, smoke, api, ui, L1, L2, L3, e2e, waiter, known-defect]
      filter:
        description: Custom TUnit tree filter, overrides the choice above (e.g. /*/*/*/*[(Category=L2)&(Category=api)])
        type: string
        required: false

concurrency:
  group: aqa-tests-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aqa/restaurant-aqa-framework
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      API_URL: ${{ vars.API_URL }}
      TEST_EMAIL_PREFIX: ${{ vars.TEST_EMAIL_PREFIX || 'aqa' }}
      TEST_EMAIL_DOMAIN: ${{ vars.TEST_EMAIL_DOMAIN || 'example.com' }}
      HEADLESS: 'true'
      TRACE: retain-on-failure
      VIDEO: retain-on-failure
      # стенд повільний (Lambda 128 MB), тому в CI спокійніше: 2 сценарії одночасно
      TEST_PARALLELISM: '2'
      UI_MAX_SESSIONS: '2'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check stand settings
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$API_URL" ]; then
            echo "::error::Repository variables BASE_URL and API_URL are not set (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          echo "UI: $BASE_URL"
          echo "API: $API_URL"

      - name: Build
        run: dotnet build --configuration Release

      - name: Install Chromium for Playwright
        run: pwsh bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Choose scenarios
        id: subset
        env:
          SUBSET: ${{ inputs.subset || 'all' }}
          CUSTOM_FILTER: ${{ inputs.filter }}
        run: |
          if [ -n "$CUSTOM_FILTER" ]; then
            filter="$CUSTOM_FILTER"
          elif [ "$SUBSET" = "all" ]; then
            filter=""
          else
            filter="/*/*/*/*[Category=$SUBSET]"
          fi
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "Scenarios: ${filter:-all}"

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          FILTER: ${{ steps.subset.outputs.filter }}
        run: |
          args=(--report-trx --report-trx-filename aqa-tests.trx --results-directory "$PWD/TestResults/trx" --output Detailed)
          if [ -n "$FILTER" ]; then
            args+=(--treenode-filter "$FILTER")
          fi
          dotnet run --configuration Release --no-build -- "${args[@]}"

      - name: Set up Java for Allure
        if: always()
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Allure report
        if: always()
        run: bash scripts/allure-report.sh

      - name: Write summary
        if: always()
        run: |
          python3 scripts/trx-summary.py "TestResults/trx/*.trx" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Allure report, traces and screenshots are in the artifacts of this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: aqa/restaurant-aqa-framework/TestResults/allure-report
          if-no-files-found: warn

      - name: Upload test results (Allure results, TRX, TUnit HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            aqa/restaurant-aqa-framework/TestResults/allure-results
            aqa/restaurant-aqa-framework/TestResults/trx
          if-no-files-found: warn

      - name: Upload failure evidence (screenshots, traces, videos, API logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence
          path: aqa/restaurant-aqa-framework/TestResults/artifacts
          if-no-files-found: ignore

      - name: Report failed scenarios
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Some scenarios failed, see the summary and the Allure report. Known defects are listed in aqa/restaurant-aqa-framework/README.md"
